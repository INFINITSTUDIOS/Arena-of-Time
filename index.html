<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena of Time</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="tint"></div>
<div id="vignette"></div>
<div id="gas"></div>

<div id="hud" class="hidden">
  <div class="side p1">
    <img class="portrait" alt="">
    <div class="bars">
      <div class="name"></div>
      <div class="hp"><i class="ghost"></i><i class="fill"></i></div>
      <div class="mana"><i class="fill"></i><span>MANA</span></div>
      <div class="chips"></div>
    </div>
    <div class="pips"></div>
  </div>
  <div class="center"><div id="timer">99</div><div id="roundlbl">ROUND 1</div></div>
  <div class="side p2">
    <div class="pips"></div>
    <div class="bars">
      <div class="name"></div>
      <div class="hp"><i class="ghost"></i><i class="fill"></i></div>
      <div class="mana"><i class="fill"></i><span>MANA</span></div>
      <div class="chips"></div>
    </div>
    <img class="portrait" alt="">
  </div>
</div>
<div id="callouts"><div class="p1"></div><div class="p2"></div></div>
<div id="announce"></div>
<div id="popups"></div>
<div id="reticle" class="hidden"><b></b><span></span></div>
<div id="prompt" class="hidden"></div>
<div id="submeter" class="hidden"><div class="lbl l">ESCAPE</div><div class="track"><i></i></div><div class="lbl r">TAP OUT</div><div class="mash"></div></div>
<div id="hint" class="hidden"></div>

<div id="title" class="screen">
  <div class="logo"><small>WORLD CHAMPIONSHIP</small><h1>ARENA <em>of</em> TIME</h1><p>Slow the clock. Break the man.</p></div>
  <div class="menu">
    <button data-mode="cpu">1 PLAYER &nbsp;vs&nbsp; CPU</button>
    <button data-mode="versus">2 PLAYERS &nbsp;·&nbsp; same keyboard</button>
    <div class="row"><span>CPU difficulty</span>
      <button class="sm" data-level="easy">Easy</button><button class="sm on" data-level="normal">Normal</button><button class="sm" data-level="hard">Hard</button></div>
    <button data-help="1" class="ghostbtn">HOW TO PLAY</button>
  </div>
  <div class="foot" id="attendance"></div>
</div>

<div id="select" class="screen hidden">
  <h2 id="selTitle">PLAYER 1 — CHOOSE YOUR FIGHTER</h2>
  <div class="selwrap">
    <div id="grid"></div>
    <div id="detail"></div>
  </div>
  <div class="selfoot"><button id="selBack" class="ghostbtn">◀ BACK</button><button id="selRandom" class="ghostbtn">RANDOM</button><button id="selGo">CONFIRM ▶</button></div>
</div>

<div id="pause" class="screen hidden">
  <h2>PAUSED</h2>
  <div class="menu"><button id="resume">RESUME</button><button id="pauseHelp" class="ghostbtn">CONTROLS &amp; MOVES</button><button id="quit" class="ghostbtn">QUIT TO MENU</button></div>
</div>

<div id="result" class="screen hidden">
  <div class="resbox"><img id="resImg" alt=""><div><small id="resHow"></small><h2 id="resName"></h2><p id="resLine"></p>
    <div class="menu"><button id="rematch">REMATCH</button><button id="reselect" class="ghostbtn">CHANGE FIGHTERS</button><button id="tomenu" class="ghostbtn">MAIN MENU</button></div></div></div>
</div>

<div id="help" class="screen hidden"><div class="helpbox"><div id="helpBody"></div><button id="helpClose">GOT IT</button></div></div>
<button id="mute" title="Sound">🔊</button>
<script type="module" src="src/main.js"></script>
</body>
</html>
